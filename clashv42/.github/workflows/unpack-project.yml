name: Unpack ZIP files

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack every ZIP in the repo root
        run: |
          set -e
          shopt -s nullglob
          ZIPS=(*.zip)

          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No ZIP file found in the repo root. Upload a .zip first."
            exit 1
          fi

          for ZIP in "${ZIPS[@]}"; do
            [ -f "$ZIP" ] || continue
            echo "=== $ZIP ==="

            rm -rf /tmp/new
            mkdir /tmp/new
            unzip -q -o "$ZIP" -d /tmp/new

            SRC=/tmp/new
            if [ "$(ls -A /tmp/new | wc -l)" = "1" ] && [ -d "/tmp/new/$(ls /tmp/new)" ]; then
              SRC="/tmp/new/$(ls /tmp/new)"
            fi

            rm -rf "$SRC/.github" "$SRC/.git"
            rm -f "$ZIP"

            case "$ZIP" in
              full*|FULL*)
                echo "FULL mode: replacing everything except .git and .github"
                find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
                ;;
              *)
                echo "SAFE mode: adding/replacing only the files inside the ZIP"
                ;;
            esac

            cp -a "$SRC"/. .
          done

          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack ZIP files" || echo "Nothing to commit"
          git push
